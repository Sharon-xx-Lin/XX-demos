/**
 * Dark Mode 机制脚本
 *
 * 初始化顺序：宿主 html-box 属性 > 宿主 ENV_UPDATE > HTML 显式属性 > localStorage > 系统偏好
 * 支持：
 * - window.__toggleDarkMode()  —— 页面内 toggle 按钮调用
 * - window.__setDarkMode(isDark) —— 显式设置
 * - postMessage ENV_UPDATE { theme: 'dark'|'light' } —— 宿主控制
 * - MutationObserver on parent body[data-html-box-theme] —— 宿主实时同步
 */
(function () {
  'use strict';

  var STORAGE_KEY = 'theme-mode';
  var HOST_SOURCE = 'workflow-host';
  var html = document.documentElement;

  function applyTheme(isDark) {
    if (isDark) {
      html.classList.add('dark');
      html.setAttribute('data-theme', 'dark');
    } else {
      html.classList.remove('dark');
      html.setAttribute('data-theme', 'light');
    }
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.setAttribute('content', isDark ? 'dark' : 'light');
  }

  function isDark() {
    return html.classList.contains('dark');
  }

  /* 初始化：宿主 html-box 属性 > HTML 显式属性（themeMode 参数） > localStorage > 系统偏好 */
  var hostBody = (window.__d2cCtx && window.__d2cCtx.hostBody) || null;
  if (!hostBody) { try { hostBody = window.frameElement && window.frameElement.ownerDocument.body; } catch (_) {} }
  var hostTheme = hostBody && hostBody.getAttribute('data-html-box-theme');

  if (hostTheme === 'dark' || hostTheme === 'light') {
    applyTheme(hostTheme === 'dark');
    localStorage.setItem(STORAGE_KEY, hostTheme);
  } else {
    var explicit = html.getAttribute('data-theme');
    if (explicit === 'dark' || explicit === 'light') {
      localStorage.setItem(STORAGE_KEY, explicit);
    } else {
      var stored = localStorage.getItem(STORAGE_KEY);
      if (stored === 'dark') {
        applyTheme(true);
      } else if (stored === 'light') {
        applyTheme(false);
      }
    }
  }

  /* 监听宿主 html-box 主题属性变化 */
  if (hostBody) {
    var mo = new MutationObserver(function () {
      var t = hostBody.getAttribute('data-html-box-theme');
      if (t === 'dark' || t === 'light') {
        applyTheme(t === 'dark');
        localStorage.setItem(STORAGE_KEY, t);
      }
    });
    mo.observe(hostBody, { attributes: true, attributeFilter: ['data-html-box-theme'] });
  }

  /* 公开 API */
  window.__toggleDarkMode = function () {
    var next = !isDark();
    applyTheme(next);
    localStorage.setItem(STORAGE_KEY, next ? 'dark' : 'light');
    window.parent.postMessage({ source: 'workflow-iframe', type: 'THEME_CHANGE', payload: { theme: next ? 'dark' : 'light' } }, '*');
  };

  window.__setDarkMode = function (value) {
    applyTheme(!!value);
    localStorage.setItem(STORAGE_KEY, value ? 'dark' : 'light');
  };

  /* 监听宿主 postMessage */
  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== HOST_SOURCE) return;

    if (msg.type === 'ENV_UPDATE' && msg.payload) {
      var theme = msg.payload.theme;
      if (theme === 'dark' || theme === 'light') {
        applyTheme(theme === 'dark');
        localStorage.setItem(STORAGE_KEY, theme);
      }
      var lang = msg.payload.lang;
      if (lang) {
        html.lang = lang;
      }
    }
  });

  /* 主动向宿主请求当前环境信息 */
  window.parent.postMessage({ source: 'workflow-iframe', type: 'REQUEST_ENV', payload: null }, '*');
})();
